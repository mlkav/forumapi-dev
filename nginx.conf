# Limit Access Configuration (Max 90 request per menit)
limit_req_zone $binary_remote_addr zone=thread_limit:10m rate=90r/m;

# HTTPS Server Block
server {
    server_name www.tricky-rice-attack-safely.st.a.dcdg.xyz tricky-rice-attack-safely.st.a.dcdg.xyz;

    root /usr/share/nginx/html;
    index index.html index.htm index.nginx-debian.html;

    # SSL Configuration (Certbot)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tricky-rice-attack-safely.st.a.dcdg.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tricky-rice-attack-safely.st.a.dcdg.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Default Route
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Resource /threads
    location /threads {
        limit_req zone=thread_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTP to HTTPS Redirect
server {
    if ($host = www.tricky-rice-attack-safely.st.a.dcdg.xyz) {
        return 301 https://$host$request_uri;
    }

    if ($host = tricky-rice-attack-safely.st.a.dcdg.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.tricky-rice-attack-safely.st.a.dcdg.xyz tricky-rice-attack-safely.st.a.dcdg.xyz;

    return 404;
}