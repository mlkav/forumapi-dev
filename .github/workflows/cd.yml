name: Continuous Deployment (GCP)

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Lint, Test & Coverage Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forumapi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forumapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_PGDATABASE: forumapi_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      ACCESS_TOKEN_AGE: 1h
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated test database configuration
        run: |
          mkdir -p config/database
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const database = {
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD,
            host: process.env.PGHOST,
            port: Number(process.env.PGPORT),
            database: process.env.TEST_PGDATABASE,
          };

          writeFileSync(
            'config/database/test.json',
            `${JSON.stringify(database, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Generate ephemeral test signing keys
        run: |
          printf 'ACCESS_TOKEN_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'REFRESH_TOKEN_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: npm run migrate:test -- up

      - name: Lint
        run: npm run lint

      - name: Run tests and coverage check
        run: npm run test:coverage

  deploy:
    name: Deploy to GCP Compute Engine
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy on Compute Engine Instance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gcloud compute ssh "${{ vars.GCE_DEPLOY_USER }}@${{ vars.GCE_INSTANCE }}" \
            --zone="${{ vars.GCE_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo git config --global --add safe.directory /opt/forum-api && sudo git -C /opt/forum-api remote set-url origin 'https://x-access-token:${GH_TOKEN}@github.com/mlkav/forumapi-dev.git' && sudo GITHUB_TOKEN='${GH_TOKEN}' /opt/forum-api/deploy/deploy-on-vm.sh"

      - name: Smoke Test (Health Check HTTPS)
        run: |
          echo "Verifying health endpoint at ${{ vars.FORUM_API_HTTPS_URL }}/health..."
          curl --fail --show-error --silent "${{ vars.FORUM_API_HTTPS_URL }}/health"
