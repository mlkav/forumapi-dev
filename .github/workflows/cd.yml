name: Continuous Deployment (GCP)

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to GCP Compute Engine
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.head_branch == 'main' ||
           github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-24.04

    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy on Compute Engine Instance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gcloud compute ssh "${{ vars.GCE_DEPLOY_USER }}@${{ vars.GCE_INSTANCE }}" \
            --zone="${{ vars.GCE_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo git config --global --add safe.directory /opt/forum-api && sudo git -C /opt/forum-api remote set-url origin 'https://x-access-token:${GH_TOKEN}@github.com/mlkav/forumapi-dev.git' && sudo GITHUB_TOKEN='${GH_TOKEN}' /opt/forum-api/deploy/deploy-on-vm.sh"

      - name: Smoke Test (Health Check HTTPS)
        run: |
          echo "Verifying health endpoint at ${{ vars.FORUM_API_HTTPS_URL }}/health..."
          curl --fail --show-error --silent "${{ vars.FORUM_API_HTTPS_URL }}/health"
